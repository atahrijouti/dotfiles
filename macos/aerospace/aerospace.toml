config-version = 2
after-startup-command = []
start-at-login = false
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 20

default-root-container-layout = 'accordion'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false
persistent-workspaces = []

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

[mode.main.binding]
    ctrl-cmd-t = 'exec-and-forget open -na Ghostty'

    # Focus Movement
    ctrl-alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    ctrl-alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    ctrl-alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    ctrl-alt-l = 'focus --boundaries-action wrap-around-the-workspace right'
    ctrl-alt-n = 'focus-monitor next --wrap-around'
    ctrl-alt-p = 'focus-monitor prev --wrap-around'

    # Window Movement
    ctrl-alt-shift-h = 'move left'
    ctrl-alt-shift-j = 'move down'
    ctrl-alt-shift-k = 'move up'
    ctrl-alt-shift-l = 'move right'
    ctrl-alt-shift-n = ['move-node-to-monitor next --wrap-around', 'focus-monitor next --wrap-around']
    ctrl-alt-shift-p = ['move-node-to-monitor prev --wrap-around', 'focus-monitor next --wrap-around']
    ctrl-alt-shift-s = 'move-workspace-to-monitor --wrap-around next'

    # Resize
    ctrl-alt-minus = 'resize smart -50'
    ctrl-alt-equal = 'resize smart +50'

    ctrl-alt-f = 'fullscreen'
    ctrl-alt-s = 'layout v_accordion'
    ctrl-alt-w = 'layout h_accordion'
    ctrl-alt-e = 'layout tiles horizontal vertical'
    ctrl-alt-space = 'layout floating tiling'

    ctrl-alt-semicolon = 'mode service'
    ctrl-alt-comma = 'mode pane'

    ctrl-alt-leftSquareBracket = 'layout tiles horizontal vertical'
    ctrl-alt-rightSquareBracket = 'layout accordion horizontal vertical'


[mode.pane.binding]
    backslash = ['split horizontal', 'mode main']
    minus = ['split vertical', 'mode main']

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    ctrl-alt-shift-h = ['join-with left', 'mode main']
    ctrl-alt-shift-j = ['join-with down', 'mode main']
    ctrl-alt-shift-k = ['join-with up', 'mode main']
    ctrl-alt-shift-l = ['join-with right', 'mode main']
